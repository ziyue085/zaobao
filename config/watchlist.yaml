# 早间情报 · 关注清单
#
# 这是唯一需要日常修改的文件。改这里即可调整「关注什么」，
# 不需要动 SKILL.md，也不需要动 scripts/ 里的任何一行代码。
#
# 字段说明见 README.md「如何修改关注列表」。

meta:
  version: "0.1.1"
  updated: "2026-10-04"
  timezone: "+08:00"
  window_hours: 24

# 栏目顺序 = 输出顺序。未出现在此列表中的栏目一律不得输出。
priority:
  - universal_policy
  - investment
  - ai
  - social
  - people_ideas
  - unexpected

sections:
  universal_policy:
    label: 普适性政策
    focus:
      - 国务院及主要部委
      - 中国人民银行
      - 财政
      - 税收
      - 金融监管
      - 房地产
      - 社保
      - 医保
      - 养老
      - 就业
      - 教育
      - 人口
      - 重大产业政策
      - 重要法律法规
      - 五年规划及全国性政策
    local_policy_rule: "地方普通政策原则上不收录，除非具有明显全国意义或公共价值"

  investment:
    label: 投资
    institutions:
      - Federal Reserve
      - 中国人民银行
      - 国务院国资委
      - 大型央企
      - 重要国企
    assets:
      - 中芯国际
      - 纳斯达克100
      - 中国石化
      - 猪周期
      - 恒顺醋业
      - 中公教育
    event_types:
      - 财报
      - 业绩预告
      - 公司公告
      - 股权变化
      - 回购
      - 增减持
      - 并购重组
      - 重大合同
      - 管理层变化
      - 监管措施
      - 产能
      - 产品
      - 行业数据
      - 猪价与生猪产能
      - 指数重大调整
      - 美联储会议与政策
      - 人民银行重要操作
    forbidden_output:
      - 利好
      - 利空
      - 值得关注
      - 可能上涨
      - 建议买入
      - 建议卖出
      - 目标价

  ai:
    label: AI
    orgs:
      - OpenAI
      - Google / DeepMind
      - Anthropic
      - Meta
      - xAI
      - Microsoft
      - NVIDIA
      - 阿里
      - 字节跳动
      - 腾讯
      - 百度
      - 华为
      - DeepSeek
      - 智谱
      - 月之暗面
      - MiniMax
      - 科大讯飞
    focus:
      - AI政策
      - 新模型
      - 推理模型
      - 多模态
      - Agent
      - AI编程
      - AI搜索
      - AI视频
      - AI终端
      - AI手机
      - AI PC
      - 智能眼镜
      - 机器人
      - 重要开源项目
      - API价格变化
      - 上下文变化
      - 模型能力实质升级
    filter_out:
      - 普通融资
      - 没有技术内容的宣传稿
      - 普通版本更新
      - 纯预告
      - 单纯榜单
      - 炒作性质信息

  social:
    label: 社会热点
    allowed:
      - 公共安全
      - 食品
      - 医疗
      - 教育
      - 交通
      - 重大社会事件
      - 全国性高关注事件
      - 具有公共价值的热点
    entertainment:
      allowed: true
      gates:
        - 热度足够高
        - 基本事实已经核实
        - 不把传闻写成事实
      note: "「上热搜」本身不等于值得收录"

  people_ideas:
    label: 人物与思想信号
    source_types:
      - 论文
      - 演讲
      - 长访谈
      - 技术文章
      - 播客
      - 公开信
      - 深度文章
    person_types:
      - 企业家
      - 科学家
      - AI研究者
      - 投资者
      - 技术专家
      - 经济学者
      - 其他真正有新观点的人
    require_at_least_one:
      - 新观点
      - 新数据
      - 新方法
      - 新判断
      - 新技术细节
    filter_out:
      - 普通鸡汤
      - 重复观点
      - 宣传稿

  unexpected:
    label: 意外但重要
    max_per_day: 3
    gates:
      - 可能成为重大历史事件
      - 显著科技突破
      - 重大国际经济或金融事件
      - 重大公共安全事件
      - 极重要的新制度
      - 异常重要的数据或现象
    note: "宁缺毋滥，门槛必须明显高于普通新闻"

# 永不输出的栏目（用户明确排除）
banned_sections:
  - 高校动态
  - 奖项动态

# 事件主体别名：用于 fingerprint 归一化。
# 同一主体换称呼（简称/全称/英文名）时，必须收敛到同一个 canonical 名称，
# 否则「同一事件被不同媒体换标题转载」会被误判为两条。
aliases:
  中芯国际:
    - SMIC
    - 中芯国际集成电路制造有限公司
    - 中芯国际集成电路制造
  中国石化:
    - 中国石油化工股份有限公司
    - 中石化
    - Sinopec
  恒顺醋业:
    - 江苏恒顺醋业股份有限公司
  中公教育:
    - 中公教育科技股份有限公司
  中国人民银行:
    - 央行
    - PBOC
    - 人民银行
  美联储:
    - Federal Reserve
    - Fed
    - 美国联邦储备委员会
  纳斯达克100:
    - NASDAQ 100
    - 纳指100
    - NDX
