# 早间情报 · 来源优先级
#
# 三层结构：
#   primary            一手来源。政府官网、监管机构、交易所、公司公告与官网、
#                      官方博客/新闻稿/GitHub、正式论文、作者原文、官方产品文档。
#   trusted_secondary  高质量新闻媒体。只用于发现线索、交叉核验、补充背景。
#   discovery_only     社交平台。只用于发现线索，除非发帖者本身就是当事人、
#                      官方账号、公司或项目负责人、论文作者。
#
# 重要：下面这份清单**不可能覆盖全部新闻**，它只是「已知来源的默认定级」。
# 遇到清单之外的域名时，按上面的定义自行判断层级，并把判断写进候选的
# sources[].tier 与 sources[].tier_reason。
#
# quasi_primary：新华社 / 央视 / 人民日报对**中央文件、国务院文件**的发布，
# 在实际操作中常常就是首发渠道。这类来源用于普适性政策时，可视为准一手，
# 但必须标注「准一手」，不得静默升级为 primary。

