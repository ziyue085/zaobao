# 搜索引擎与内容农场得到的 URL **永远不能**作为来源引用。
# 这些域名一旦出现在 sources[].url 或 primary_url 中，直接判 REJECT。
never_a_source:
  - baidu.com/s
  - www.baidu.com/s
  - google.com/search
  - bing.com/search
  - sogou.com
  - so.com
  - sm.cn
  - baijiahao.baidu.com
  - zhidao.baidu.com
  - wenku.baidu.com
  - answers.com

# 专业工具优先：能用专项工具拿到的一手数据，不要用搜索引擎摘要替代。
tool_priority:
  - name: 行情工具
    use_for: [股票价格, 指数点位, 指数成分调整]
  - name: 公司公告 / 财务工具
    use_for: [财报, 业绩预告, 公司公告, 股权变化, 回购, 增减持]
  - name: 官方数据库
    use_for: [宏观经济数据, 人口数据, 就业数据]
  - name: 官网直取
    use_for: [美联储, 人民银行, 交易所, 监管机构, 公司官网, GitHub 仓库, 论文原文]
  - name: 联网搜索
    use_for: [发现新闻, 找原文, 交叉验证, 补充上下文]
    constraint: "搜索结果摘要不得作为最终证据"
